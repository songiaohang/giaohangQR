</style>

<body>

<script>

/* ==========================================================
   API WEB APP CODE.GS
   ========================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbymQ00Br51ycitNyjiJRfjjPfRMOcKI4G8u2ywX5IGr9WLJKzyk50nA5RqIiUEWfQMq6g/exec";


/* ==========================================================
   BIEN
   ========================================================== */

let nv = "";

let stream = null;

let running = false;

let qrFound = false;

let ocrRunning = false;

let noQrSince = 0;

let lastCode = "";

let lastMethod = "";

let lastCodeTime = 0;

let currentOrder = null;

let currentMethod = "";

let audioCtx = null;


/* ==========================================================
   DOM
   ========================================================== */

const video =
document.getElementById("video");

const scanStatus =
document.getElementById("scanStatus");

const canvas =
document.getElementById("ocrCanvas");

const ctx =
canvas.getContext(
  "2d",
  {willReadFrequently:true}
);


/* ==========================================================
   TRANG THAI
   ========================================================== */

function setStatus(msg, cls="") {

  scanStatus.textContent = msg;

  scanStatus.className =
    "status " + cls;

}


/* ==========================================================
   BEEP
   QR = 1 TIENG
   ID = 2 TIENG
   ========================================================== */

function beep(count=1) {

  try {

    if (!audioCtx) {

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const start =
      audioCtx.currentTime;

    for(let i=0;i<count;i++){

      const osc =
        audioCtx.createOscillator();

      const gain =
        audioCtx.createGain();

      osc.type = "sine";

      osc.frequency.value = 900;

      const t =
        start + i * 0.18;

      gain.gain.setValueAtTime(
        0.0001,
        t
      );

      gain.gain.exponentialRampToValueAtTime(
        0.25,
        t + 0.01
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        t + 0.11
      );

      osc.connect(gain);

      gain.connect(
        audioCtx.destination
      );

      osc.start(t);

      osc.stop(t + 0.12);
    }

  } catch(e) {

    console.log(
      "Khong phat duoc am thanh:",
      e
    );

  }

}


/* ==========================================================
   API GET
   ========================================================== */

function apiGet(params) {

  const qs =
    new URLSearchParams(params)
      .toString();

  return fetch(
    API_URL + "?" + qs,
    {
      method:"GET",
      redirect:"follow"
    }
  )
  .then(r => {

    if(!r.ok){

      throw new Error(
        "API HTTP " + r.status
      );

    }

    return r.text();

  })
  .then(t => {

    try{

      return JSON.parse(t);

    }catch(e){

      throw new Error(
        "API khong tra JSON: " +
        t.slice(0,200)
      );

    }

  });

}


/* ==========================================================
   DANG NHAP
   ========================================================== */

function dangNhap() {

  const maNV =
    document
      .getElementById("maNV")
      .value
      .trim();

  const matKhau =
    document
      .getElementById("matKhau")
      .value;

  const box =
    document.getElementById(
      "loginMsg"
    );


  if(!maNV || !matKhau){

    box.textContent =
      "Vui long nhap ma nhan vien va mat khau";

    box.className =
      "status err";

    return;

  }


  box.textContent =
    "Dang kiem tra...";

  box.className =
    "status";


  apiGet({

    action:"dangNhap",

    maNV:maNV,

    matKhau:matKhau

  })

  .then(r => {

    if(!r.ok){

      throw new Error(
        r.msg ||
        "Dang nhap that bai"
      );

    }


    nv =
      r.maNV ||
      maNV;


    document
      .getElementById("nvHienTai")
      .textContent = nv;


    document
      .getElementById("loginCard")
      .classList
      .add("hidden");


    document
      .getElementById("appCard")
      .classList
      .remove("hidden");


    taiBaoCao();

    batDauQuet();

  })

  .catch(e => {

    box.textContent =
      e.message;

    box.className =
      "status err";

  });

}


/* ==========================================================
   DANG XUAT
   ========================================================== */

function dangXuat() {

  dungCamera();

  nv = "";

  currentOrder = null;

  currentMethod = "";

  document
    .getElementById("appCard")
    .classList
    .add("hidden");

  document
    .getElementById("loginCard")
    .classList
    .remove("hidden");

  document
    .getElementById("maNV")
    .value = "";

  document
    .getElementById("matKhau")
    .value = "";

}


/* ==========================================================
   BAT CAMERA
   ========================================================== */

async function batDauQuet() {

  document
    .getElementById("resultCard")
    .classList
    .add("hidden");


  currentOrder = null;

  currentMethod = "";

  qrFound = false;

  ocrRunning = false;

  lastCode = "";

  lastMethod = "";

  noQrSince =
    performance.now();


  if(!stream){

    try{

      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video:{
              facingMode:{
                ideal:"environment"
              },

              width:{
                ideal:1280
              },

              height:{
                ideal:720
              }

            },

            audio:false

          });


      video.srcObject =
        stream;

      await video.play();

    }catch(e){

      setStatus(
        "Khong mo duoc camera: " +
        e.message,
        "err"
      );

      return;

    }

  }


  running = true;

  setStatus(
    "Dang tim QR...",
    ""
  );


  requestAnimationFrame(
    vongQuet
  );

}


/* ==========================================================
   DUNG CAMERA
   ========================================================== */

function dungCamera() {

  running = false;

  if(stream){

    stream
      .getTracks()
      .forEach(t => t.stop());

    stream = null;

  }

}


/* ==========================================================
   VONG QUET
   ========================================================== */

function vongQuet() {

  if(!running) return;


  if(
    video.readyState >= 2 &&
    video.videoWidth > 0
  ){

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    canvas.width = w;

    canvas.height = h;


    ctx.drawImage(
      video,
      0,
      0,
      w,
      h
    );


    const image =
      ctx.getImageData(
        0,
        0,
        w,
        h
      );


    const code =
      jsQR(
        image.data,
        w,
        h,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if(
      code &&
      code.data
    ){

      const value =
        String(
          code.data
        ).trim();


      if(value){

        qrFound = true;

        noQrSince =
          performance.now();


        xuLyMa(
          value,
          "QR"
        );

        return;

      }

    }

  }


  /* OCR ID */

  if(
    !qrFound &&
    !ocrRunning &&
    performance.now() -
    noQrSince > 1600
  ){

    nhanDangID();

  }


  requestAnimationFrame(
    vongQuet
  );

}


/* ==========================================================
   OCR ID
   ========================================================== */

async function nhanDangID() {

  if(
    ocrRunning ||
    !running ||
    qrFound
  ) return;


  ocrRunning = true;


  setStatus(
    "Khong thay QR -> dang nhan dien ID don hang...",
    ""
  );


  try{

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    const cropW = w;

    const cropH =
      Math.floor(
        h * 0.62
      );


    canvas.width =
      cropW;

    canvas.height =
      cropH;


    ctx.drawImage(
      video,
      0,
      0,
      w,
      cropH,
      0,
      0,
      cropW,
      cropH
    );


    const worker =
      await Tesseract
        .createWorker("vie");


    const ret =
      await worker.recognize(
        canvas
      );


    await worker.terminate();


    const text =
      ret.data.text || "";


    const id =
      timIDTrongOCR(text);


    if(id){

      xuLyMa(
        id,
        "OCR_ID"
      );

      return;

    }


    setStatus(
      "Chua doc duoc ID -> dua phieu gan va ro hon...",
      ""
    );


  }catch(e){

    setStatus(
      "OCR loi: " +
      e.message,
      "err"
    );

  }finally{

    ocrRunning = false;


    if(
      running &&
      !qrFound
    ){

      noQrSince =
        performance.now() +
        900;

    }

  }

}


/* ==========================================================
   TIM ID TRONG OCR
   ========================================================== */

function timIDTrongOCR(text) {

  const s =
    String(text || "")
      .replace(/[|]/g,"1")
      .replace(/[Oo]/g,"0")
      .replace(/[IiLl]/g,"1");


  const lines =
    s.split(/\r?\n/);


  for(
    const line of lines
  ){

    if(
      /id\s*don\s*hang|
       id\s*đơn\s*hàng|
       don\s*hang|
       đơn\s*hàng/i
      .test(line)
    ){

      const m =
        line.match(
          /\b\d{8,14}\b/
        );


      if(m){

        return m[0];

      }

    }

  }


  const all =
    s.match(
      /\b\d{10}\b/g
    );


  return
    all &&
    all.length
      ? all[0]
      : "";

}


/* ==========================================================
   XU LY MA NHAN DANG
   ========================================================== */

function xuLyMa(
  ma,
  phuongThuc
){

  ma =
    String(ma || "")
      .trim();


  if(!ma) return;


  /* CHONG QUET LAP */

  if(
    ma === lastCode &&
    phuongThuc === lastMethod &&
    performance.now() -
    lastCodeTime < 5000
  ){

    return;

  }


  lastCode = ma;

  lastMethod =
    phuongThuc;

  lastCodeTime =
    performance.now();


  running = false;


  setStatus(
    "Dang kiem tra " +
    (
      phuongThuc === "QR"
        ? "QR"
        : "ID"
    ) +
    "...",
    ""
  );


  /*
     QR -> tim cot A
     OCR ID -> tim cot B
  */

  apiGet({

    action:"timDon",

    maQR:ma,

    phuongThuc:
      phuongThuc === "QR"
        ? "QR"
        : "ID"

  })

  .then(r => {

    if(!r.ok){

      throw new Error(
        r.msg ||
        "Khong tim thay don hang"
      );

    }


    currentOrder = r;

    currentMethod =
      phuongThuc;


    /* BEEP CHI SAU KHI BACKEND XAC NHAN */

    if(
      phuongThuc === "QR"
    ){

      beep(1);

    }else{

      beep(2);

    }


    luuAnhNhanDien(
      ma,
      phuongThuc
    );


    hienThiDon(
      r,
      phuongThuc,
      ma
    );

  })

  .catch(e => {

    setStatus(
      e.message,
      "err"
    );


    document
      .getElementById("resultCard")
      .classList
      .add("hidden");


    setTimeout(
      () => {

        if(stream){

          running = true;

          qrFound = false;

          noQrSince =
            performance.now();

          requestAnimationFrame(
            vongQuet
          );

        }

      },
      1200
    );

  });

}


/* ==========================================================
   HIEN THI DON
   ========================================================== */

function hienThiDon(
  r,
  method,
  ma
){

  document
    .getElementById("methodBadge")
    .textContent =
      method === "QR"
        ? "NHẬN DẠNG BẰNG QR"
        : "NHẬN DẠNG BẰNG ID";


  document
    .getElementById("maNhanDang")
    .textContent =
      ma || "";


  document
    .getElementById("maDon")
    .textContent =
      r.maDon || "";


  /*
     Code.gs hiện tại chưa có
     tenKhach / diaChi thì để trống.
     Khi Code.gs bổ sung 2 trường này,
     frontend tự hiển thị.
  */

  document
    .getElementById("tenKhach")
    .textContent =
      r.tenKhach ||
      r.khachHang ||
      "";


  document
    .getElementById("diaChi")
    .textContent =
      r.diaChi ||
      r.diaChiGiao ||
      "";


  document
    .getElementById("tenHang")
    .textContent =
      r.tenHang || "";


  document
    .getElementById("soLuong")
    .textContent =
      r.soLuong ?? 0;


  document
    .getElementById("tonKho")
    .textContent =
      r.tonKho ?? 0;


  document
    .getElementById("trangThai")
    .textContent =
      r.trangThai || "";


  document
    .getElementById("resultCard")
    .classList
    .remove("hidden");


  setStatus(
    "Da nhan dang thanh cong",
    "ok"
  );

}


/* ==========================================================
   LUU ANH NHAN DIEN
   ========================================================== */

async function luuAnhNhanDien(
  ma,
  phuongThuc
){

  try{

    if(
      !video.videoWidth ||
      !video.videoHeight
    ){

      return;

    }


    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    const c =
      document.createElement(
        "canvas"
      );


    c.width = w;

    c.height = h;


    const cctx =
      c.getContext("2d");


    cctx.drawImage(
      video,
      0,
      0,
      w,
      h
    );


    const dataURL =
      c.toDataURL(
        "image/jpeg",
        0.75
      );


    apiGet({

      action:
        "luuAnhNhanDien",

      ma:ma,

      phuongThuc:
        phuongThuc,

      maNV:nv,

      anh:dataURL

    })
    .catch(
      e =>
        console.log(
          "Luu anh loi:",
          e
        )
    );


  }catch(e){

    console.log(
      "Luu anh loi:",
      e
    );

  }

}


/* ==========================================================
   NHAP HANG
   ========================================================== */

async function xuLyNhapHang() {

  if(!currentOrder){

    return;

  }


  let soLuong =
    prompt(
      "Nhap so luong:",
      "1"
    );


  if(
    soLuong === null
  ){

    return;

  }


  soLuong =
    Number(soLuong);


  if(
    !Number.isFinite(
      soLuong
    ) ||
    soLuong <= 0
  ){

    alert(
      "So luong khong hop le."
    );

    return;

  }


  const tienHang =
    Number(
      currentOrder.tienHang || 0
    );


  const tienShip = 3200;


  const xacNhan =
    confirm(
      "Xac nhan NHAP HANG\n\n" +
      "Ma: " +
      (
        currentMethod === "QR"
          ? currentOrder.maQR
          : currentOrder.maDon
      ) +
      "\nSo luong: " +
      soLuong +
      "\nTien hang: " +
      dinhDangTien(
        tienHang
      ) +
      "\nTien ship: " +
      dinhDangTien(
        tienShip
      )
    );


  if(!xacNhan){

    return;

  }


  setStatus(
    "Dang nhap hang...",
    ""
  );


  try{

    const r =
      await apiGet({

        action:"nhapHang",

        maQR:
          currentMethod === "QR"
            ? currentOrder.maQR
            : currentOrder.maDon,

        phuongThuc:
          currentMethod === "QR"
            ? "QR"
            : "ID",

        maNV:nv,

        soLuongNhap:
          soLuong

      });


    if(!r.ok){

      throw new Error(
        r.msg ||
        "Nhap hang that bai"
      );

    }


    alert(
      "NHAP HANG THANH CONG\n\n" +
      "Ton kho moi: " +

        r.tonKho ?? ""

    taiBaoCao();

    tiepTucQuet();


  }catch(e){

    alert(
      e.message
    );

    setStatus(
      e.message,
      "err"
    );

  }

}

/* ==========================================================
   BAO CAO
   ========================================================== */

function taiBaoCao() {

  const box =
    document.getElementById(
      "baoCaoNgay"
    );


  box.innerHTML =
    "Dang tai bao cao...";


  const ngay =
    new Date();


  const yyyy =
    ngay.getFullYear();


  const mm =
    String(
      ngay.getMonth()+1
    ).padStart(2,"0");


  const dd =
    String(
      ngay.getDate()
    ).padStart(2,"0");


  const ngayStr =
    yyyy +
    "-" +
    mm +
    "-" +
    dd;


  apiGet({

    action:
      "baoCaoTrongNgay",

    ngay:
      ngayStr

  })

  .then(r => {

    if(!r.ok){

      throw new Error(
        r.msg ||
        "Khong tai duoc bao cao"
      );

    }


    hienThiBaoCao(r);

  })

  .catch(e => {

    box.innerHTML =
      '<div class="status err">' +
      e.message +
      '</div>';

  });

}


/* ==========================================================
   HIEN BAO CAO
   ========================================================== */

function hienThiBaoCao(r) {

  const slQR =
    Number(
      r.slDonQR ??
      r.soDonQR ??
      0
    );


  const tienQR =
    Number(
      r.tongTienQR ??
      0
    );


  const shipQR =
    Number(
      r.tienShipQR ??
      0
    );


  const slID =
    Number(
      r.slDonID ??
      0
    );


  const tienID =
    Number(
      r.tongTienID ??
      0
    );


  const shipID =
    Number(
      r.tienShipID ??
      0
    );


  const shipTong =
    Number(
      r.tongShipIDQR ??
      (
        shipQR +
        shipID
      )
    );


  const slHoan =
    Number(
      r.slDonHoan ??
      r.soDonHoan ??
      0
    );


  document
    .getElementById(
      "baoCaoNgay"
    )
    .innerHTML = `

      <div class="reportGrid">

        <div class="reportBox">

          <div class="reportTitle">
            QR
          </div>

          <div class="reportLine">
            <span>So don</span>
            <b>${slQR}</b>
          </div>

          <div class="reportLine">
            <span>Tien hang</span>
            <b>${dinhDangTien(tienQR)}</b>
          </div>

          <div class="reportLine">
            <span>Tien ship</span>
            <b>${dinhDangTien(shipQR)}</b>
          </div>

        </div>


        <div class="reportBox">

          <div class="reportTitle">
            ID
          </div>

          <div class="reportLine">
            <span>So don</span>
            <b>${slID}</b>
          </div>

          <div class="reportLine">
            <span>Tien hang</span>
            <b>${dinhDangTien(tienID)}</b>
          </div>

          <div class="reportLine">
            <span>Tien ship</span>
            <b>${dinhDangTien(shipID)}</b>
          </div>

        </div>

      </div>


      <div class="totalBox">

        Tong tien ship QR + ID:
        ${dinhDangTien(shipTong)}

        <br><br>

        So don hoan:
        ${slHoan}

      </div>

    `;

}


/* ==========================================================
   DINH DANG TIEN
   ========================================================== */

function dinhDangTien(n) {

  return Number(
    n || 0
  ).toLocaleString(
    "vi-VN"
  ) + " đ";

}
