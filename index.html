<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Quản lý giao nhận</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#222;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 2px 12px #0001;
  margin-bottom:12px;
}

h2{
  margin:0 0 14px;
  text-align:center;
}

input,button{
  width:100%;
  height:48px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:17px;
  padding:0 12px;
}

button{
  border:0;
  background:#1976d2;
  color:#fff;
  font-weight:bold;
  margin-top:10px;
}

button.secondary{
  background:#555;
}

button.success{
  background:#188038;
}

button.warn{
  background:#e37400;
}

button.danger{
  background:#c5221f;
}

.hidden{
  display:none !important;
}

#cameraBox{
  position:relative;
  background:#111;
  border-radius:14px;
  overflow:hidden;
}

#video{
  width:100%;
  display:block;
  aspect-ratio:3/4;
  object-fit:cover;
}

#scanLine{
  position:absolute;
  left:8%;
  right:8%;
  top:48%;
  height:2px;
  background:#00e676;
  box-shadow:0 0 8px #00e676;
}

.status{
  text-align:center;
  padding:10px;
  font-weight:bold;
}

.ok{
  color:#188038;
}

.err{
  color:#c5221f;
}

.small{
  font-size:13px;
  color:#666;
  text-align:center;
  margin-top:8px;
}

.result{
  line-height:1.6;
}

.label{
  font-size:13px;
  color:#777;
  margin-top:8px;
}

.value{
  font-size:18px;
  font-weight:bold;
  word-break:break-word;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e8f0fe;
  color:#174ea6;
  font-size:13px;
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.row2 button{
  margin-top:10px;
}

#ocrCanvas{
  display:none;
}

.report{
  background:#f8f9fa;
  border-radius:10px;
  padding:12px;
  line-height:1.7;
}

.report b{
  font-size:16px;
}
</style>
</head>

<body>

<div class="wrap">

<!-- ================= LOGIN ================= -->

<div id="loginCard" class="card">

  <h2>ĐĂNG NHẬP</h2>

  <input
    id="maNV"
    placeholder="Mã nhân viên"
    autocomplete="username"
  >

  <input
    id="matKhau"
    type="password"
    placeholder="Mật khẩu"
    autocomplete="current-password"
    style="margin-top:10px"
  >

  <button onclick="dangNhap()">
    ĐĂNG NHẬP
  </button>

  <div id="loginMsg" class="status"></div>

</div>


<!-- ================= APP ================= -->

<div id="appCard" class="hidden">

  <div class="card">

    <div style="display:flex;justify-content:space-between;align-items:center">

      <b>
        NHÂN VIÊN:
        <span id="nvHienTai"></span>
      </b>

      <button
        class="secondary"
        style="width:auto;height:38px;margin:0"
        onclick="dangXuat()"
      >
        THOÁT
      </button>

    </div>

  </div>


  <!-- ================= CAMERA ================= -->

  <div class="card">

    <h2>QUÉT ĐƠN HÀNG</h2>

    <div id="cameraBox">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div id="scanLine"></div>

    </div>

    <canvas id="ocrCanvas"></canvas>

    <div id="scanStatus" class="status">
      Đang chuẩn bị camera...
    </div>

    <div class="small">
      Ưu tiên QR. Nếu không thấy QR, máy tự nhận diện ID đơn hàng.
    </div>

    <button
      class="secondary"
      onclick="batDauQuet()"
    >
      QUÉT LẠI
    </button>

  </div>


  <!-- ================= KẾT QUẢ ================= -->

  <div id="resultCard" class="card hidden">

    <div style="text-align:center;margin-bottom:8px">

      <span
        id="methodBadge"
        class="badge"
      ></span>

    </div>


    <div class="result">

      <div class="label">
        Mã nhận dạng
      </div>

      <div
        id="maNhanDang"
        class="value"
      ></div>


      <div class="label">
        ID đơn hàng
      </div>

      <div
        id="maDon"
        class="value"
      ></div>


      <div class="label">
        Tên hàng
      </div>

      <div
        id="tenHang"
        class="value"
      ></div>


      <div class="label">
        Số lượng
      </div>

      <div
        id="soLuong"
        class="value"
      ></div>


      <div class="label">
        Tồn kho
      </div>

      <div
        id="tonKho"
        class="value"
      ></div>


      <div class="label">
        Trạng thái
      </div>

      <div
        id="trangThai"
        class="value"
      ></div>

    </div>


    <!-- 3 NÚT CHÍNH -->

    <button
      class="success"
      onclick="xuLyNhapHang()"
    >
      NHẬP HÀNG
    </button>

    <button
      onclick="xuLyGiaoHang()"
    >
      GIAO HÀNG
    </button>

    <button
      class="warn"
      onclick="xuLyHoanHang()"
    >
      HOÀN HÀNG
    </button>


    <!-- TIẾP / THOÁT -->

    <div class="row2">

      <button
        class="secondary"
        onclick="tiepTucQuet()"
      >
        TIẾP
      </button>

      <button
        class="danger"
        onclick="dangXuat()"
      >
        THOÁT
      </button>

    </div>

  </div>


  <!-- ================= BÁO CÁO ================= -->

  <div class="card">

    <h2>BÁO CÁO TRONG NGÀY</h2>

    <div
      id="baoCao"
      class="report"
    >
      Đang tải báo cáo...
    </div>

    <button
      class="secondary"
      onclick="taiBaoCao()"
    >
      CẬP NHẬT BÁO CÁO
    </button>

  </div>

</div>

</div>


<script>

/* ==========================================================
   URL WEB APP CODE.GS
   ========================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbymQ00Br51ycitNyjiJRfjjPfRMOcKI4G8u2ywX5IGr9WLJKzyk50nA5RqIiUEWfQMq6g/exec";


/* ==========================================================
   BIẾN
   ========================================================== */

let nv = "";

let stream = null;

let running = false;

let qrFound = false;

let ocrRunning = false;

let noQrSince = 0;

let lastCode = "";

let lastCodeTime = 0;

let currentOrder = null;

let currentMethod = "";

let audioCtx = null;


/* ==========================================================
   CAMERA
   ========================================================== */

const video =
document.getElementById("video");

const scanStatus =
document.getElementById("scanStatus");

const canvas =
document.getElementById("ocrCanvas");

const ctx =
canvas.getContext(
  "2d",
  {willReadFrequently:true}
);


/* ==========================================================
   TRẠNG THÁI
   ========================================================== */

function setStatus(msg, cls="") {

  scanStatus.textContent = msg;

  scanStatus.className =
    "status " + cls;

}


/* ==========================================================
   BEEP
   ========================================================== */

function beep(count=1) {

  try {

    if (!audioCtx) {

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioCtx.state ===
      "suspended"
    ) {

      audioCtx.resume();

    }

    const start =
      audioCtx.currentTime;

    for (
      let i=0;
      i<count;
      i++
    ) {

      const osc =
        audioCtx.createOscillator();

      const gain =
        audioCtx.createGain();

      osc.type = "sine";

      osc.frequency.value = 900;

      const t =
        start + i * 0.18;

      gain.gain.setValueAtTime(
        0.0001,
        t
      );

      gain.gain.exponentialRampToValueAtTime(
        0.25,
        t + 0.01
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        t + 0.11
      );

      osc.connect(gain);

      gain.connect(
        audioCtx.destination
      );

      osc.start(t);

      osc.stop(t + 0.12);

    }

  } catch(e) {

    console.log(
      "Khong phat duoc am thanh:",
      e
    );

  }

}


/* ==========================================================
   API GET
   ========================================================== */

function apiGet(params) {

  const qs =
    new URLSearchParams(params)
      .toString();

  return fetch(
    API_URL + "?" + qs,
    {
      method:"GET",
      redirect:"follow"
    }
  )

  .then(function(r){

    if (!r.ok) {

      throw new Error(
        "API HTTP " + r.status
      );

    }

    return r.text();

  })

  .then(function(t){

    try {

      return JSON.parse(t);

    } catch(e) {

      throw new Error(
        "API khong tra JSON: " +
        t.substring(0,200)
      );

    }

  });

}


/* ==========================================================
   ĐĂNG NHẬP
   ========================================================== */

function dangNhap() {

  const maNV =
    document
      .getElementById("maNV")
      .value
      .trim();

  const matKhau =
    document
      .getElementById("matKhau")
      .value;

  const box =
    document
      .getElementById("loginMsg");


  if (
    !maNV ||
    !matKhau
  ) {

    box.textContent =
      "Vui lòng nhập mã nhân viên và mật khẩu";

    box.className =
      "status err";

    return;

  }


  box.textContent =
    "Đang kiểm tra...";

  box.className =
    "status";


  apiGet({

    action:"dangNhap",

    maNV:maNV,

    matKhau:matKhau

  })

  .then(function(r){

    if (!r.ok) {

      throw new Error(
        r.msg ||
        "Đăng nhập thất bại"
      );

    }


    nv = r.maNV;


    document
      .getElementById("nvHienTai")
      .textContent = nv;


    document
      .getElementById("loginCard")
      .classList
      .add("hidden");


    document
      .getElementById("appCard")
      .classList
      .remove("hidden");


    beep(1);

    batDauQuet();

    taiBaoCao();

  })

  .catch(function(e){

    box.textContent =
      e.message;

    box.className =
      "status err";

  });

}


/* ==========================================================
   ĐĂNG XUẤT
   ========================================================== */

function dangXuat() {

  dungCamera();

  nv = "";

  currentOrder = null;

  currentMethod = "";

  document
    .getElementById("appCard")
    .classList
    .add("hidden");

  document
    .getElementById("loginCard")
    .classList
    .remove("hidden");

}


/* ==========================================================
   CAMERA BẮT ĐẦU
   ========================================================== */

async function batDauQuet() {

  document
    .getElementById("resultCard")
    .classList
    .add("hidden");


  qrFound = false;

  ocrRunning = false;

  lastCode = "";

  noQrSince =
    performance.now();


  if (!stream) {

    try {

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{
              facingMode:{
                ideal:"environment"
              },

              width:{
                ideal:1280
              },

              height:{
                ideal:720
              }

            },

            audio:false

          });


      video.srcObject =
        stream;

      await video.play();


    } catch(e) {

      setStatus(
        "Không mở được camera: " +
        e.message,
        "err"
      );

      return;

    }

  }


  running = true;


  setStatus(
    "Đang tìm QR..."
  );


  requestAnimationFrame(
    vongQuet
  );

}


/* ==========================================================
   DỪNG CAMERA
   ========================================================== */

function dungCamera() {

  running = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(function(t){

        t.stop();

      });

    stream = null;

  }

}


/* ==========================================================
   VÒNG QUÉT
   ========================================================== */

function vongQuet() {

  if (!running) {

    return;

  }


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0
  ) {

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    canvas.width = w;

    canvas.height = h;


    ctx.drawImage(
      video,
      0,
      0,
      w,
      h
    );


    const image =
      ctx.getImageData(
        0,
        0,
        w,
        h
      );


    const code =
      jsQR(
        image.data,
        w,
        h,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (
      code &&
      code.data
    ) {

      const value =
        String(
          code.data
        ).trim();


      if (value) {

        qrFound = true;

        noQrSince =
          performance.now();


        xuLyMa(
          value,
          "QR"
        );

        return;

      }

    }

  }


  if (
    !qrFound &&
    !ocrRunning &&
    performance.now() -
      noQrSince >
      1600
  ) {

    nhanDangID();

  }


  requestAnimationFrame(
    vongQuet
  );

}


/* ==========================================================
   OCR ID
   ========================================================== */

async function nhanDangID() {

  if (
    ocrRunning ||
    !running ||
    qrFound
  ) {

    return;

  }


  ocrRunning = true;


  setStatus(
    "Không thấy QR → đang nhận diện ID đơn hàng..."
  );


  try {

    const w =
      video.videoWidth;

    const h =
      video.videoHeight;


    const cropH =
      Math.floor(
        h * 0.62
      );


    canvas.width = w;

    canvas.height =
      cropH;


    ctx.drawImage(
      video,
      0,
      0,
      w,
      cropH,
      0,
      0,
      w,
      cropH
    );


    const worker =
      await Tesseract.createWorker(
        "vie"
      );


    const ret =
      await worker.recognize(
        canvas
      );


    await worker.terminate();


    const text =
      ret.data.text || "";


    const id =
      timIDTrongOCR(
        text
      );


    if (id) {

      xuLyMa(
        id,
        "OCR_ID"
      );

      return;

    }


    setStatus(
      "Chưa đọc được ID → đưa phiếu gần và rõ hơn..."
    );


  } catch(e) {

    setStatus(
      "OCR lỗi: " +
      e.message,
      "err"
    );

  } finally {

    ocrRunning = false;


    if (
      running &&
      !qrFound
    ) {

      noQrSince =
        performance.now() +
        900;

    }

  }

}


/* ==========================================================
   TÌM ID TRONG KẾT QUẢ OCR
   ========================================================== */

function timIDTrongOCR(text) {

  const s =
    String(text || "")
      .replace(/\|/g,"1")
      .replace(/[Oo]/g,"0")
      .replace(/[IiLl]/g,"1");


  const lines =
    s.split(/\r?\n/);


  for (
    let i=0;
    i<lines.length;
    i++
  ) {

    const line =
      lines[i];


    if (
      /id\s*don\s*hang|id\s*dơn\s*hang|don\s*hang/i
        .test(line)
    ) {

      const m =
        line.match(
          /\b\d{8,14}\b/
        );


      if (m) {

        return m[0];

      }

    }

  }


  const all =
    s.match(
      /\b\d{10}\b/g
    );


  if (
    all &&
    all.length
  ) {

    return all[0];

  }


  return "";

}


/* ==========================================================
   XỬ LÝ MÃ QR / ID
   ========================================================== */

function xuLyMa(
  ma,
  phuongThuc
) {

  ma =
    String(ma || "")
      .trim();


  if (!ma) {

    return;

  }


  if (
    ma === lastCode &&
    performance.now() -
      lastCodeTime <
      5000
  ) {

    return;

  }


  lastCode =
    ma;

  lastCodeTime =
    performance.now();


  running = false;


  setStatus(
    "Đang kiểm tra " +
    (
      phuongThuc === "QR"
        ? "QR"
        : "ID"
    ) +
    ": " +
    ma
  );


  apiGet({

    action:"timDon",

    maQR:ma,

    phuongThuc:
      phuongThuc === "QR"
        ? "QR"
        : "ID"

  })

  .then(function(r){

    if (!r.ok) {

      throw new Error(
        r.msg ||
        "Không tìm thấy đơn hàng"
      );

    }


    currentOrder =
      r;

    currentMethod =
      phuongThuc;


    beep(
      phuongThuc === "QR"
        ? 1
        : 2
    );


    hienThiDon(
      r,
      phuongThuc,
      ma
    );


    luuAnhNhanDien(
      ma,
      phuongThuc
    );


  })

  .catch(function(e){

    setStatus(
      e.message,
      "err"
    );


    document
      .getElementById("resultCard")
      .classList
      .add("hidden");


    setTimeout(
      function(){

        if (stream) {

          running = true;

          noQrSince =
            performance.now();

          requestAnimationFrame(
            vongQuet
          );

        }

      },
      1200
    );

  });

}


/* ==========================================================
   HIỂN THỊ ĐƠN
   ========================================================== */

function hienThiDon(
  r,
  method,
  ma
) {

  document
    .getElementById("methodBadge")
    .textContent =
      method === "QR"
        ? "NHẬN DẠNG BẰNG QR"
        : "NHẬN DẠNG BẰNG ID";


  document
    .getElementById("maNhanDang")
    .textContent =
      ma;


  document
    .getElementById("maDon")
    .textContent =
      r.maDon || "";


  document
    .getElementById("tenHang")
    .textContent =
      r.tenHang || "";


  document
    .getElementById("soLuong")
    .textContent =
      r.soLuong || 0;


  document
    .getElementById("tonKho")
    .textContent =
      r.tonKho || 0;


  document
    .getElementById("trangThai")
    .textContent =
      r.trangThai || "";


  document
    .getElementById("resultCard")
    .classList
    .remove("hidden");


  setStatus(
    "Đã nhận dạng thành công",
    "ok"
  );

}


/* ==========================================================
   LƯU ẢNH NHẬN DIỆN
   ========================================================== */

async function luuAnhNhanDien(
  ma,
  phuongThuc
) {

  try {

    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      return;

    }


    const c =
      document.createElement(
        "canvas"
      );


    c.width =
      video.videoWidth;

    c.height =
      video.videoHeight;


    const cctx =
      c.getContext("2d");


    cctx.drawImage(
      video,
      0,
      0,
      c.width,
      c.height
    );


    const anh =
      c.toDataURL(
        "image/jpeg",
        0.55
      );


    /*
      Ảnh nhận diện được gửi bằng POST.
      Không dùng GET vì ảnh base64 rất dài.
    */

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:JSON.stringify({

            action:
              "luuAnhNhanDien",

            ma:ma,

            phuongThuc:
              phuongThuc,

            maNV:nv,

            anh:anh

          })
        }
      );


    const text =
      await response.text();


    console.log(
      "Luu anh:",
      text
    );


  } catch(e) {

    console.log(
      "Loi luu anh:",
      e
    );

  }

}


/* ==========================================================
   NHẬP HÀNG
   ========================================================== */

function xuLyNhapHang() {

  if (!currentOrder) {

    return;

  }


  const ton =
    Number(
      currentOrder.tonKho || 0
    );


  if (ton > 0) {

    const ok =
      confirm(
        "Mã này đã có hàng trong kho.\n\n" +
        "Tồn hiện tại: " +
        ton +
        "\n\n" +
        "Bạn có muốn nhập thêm không?"
      );


    if (!ok) {

      tiepTucQuet();

      return;

    }

  }


  let soLuong =
    prompt(
      "Nhập số lượng hàng:",
      "1"
    );


  if (
    soLuong === null
  ) {

    return;

  }


  soLuong =
    Number(
      soLuong
    );


  if (
    !Number.isFinite(
      soLuong
    ) ||
    soLuong <= 0
  ) {

    alert(
      "Số lượng không hợp lệ."
    );

    return;

  }


  const tienHang =
    Number(
      currentOrder.tienHang || 0
    );


  const tienShip = 3200;


  const ok =
    confirm(
      "Xác nhận NHẬP HÀNG\n\n" +
      "Mã đơn: " +
      (
        currentOrder.maDon ||
        ""
      ) +
      "\nSố lượng: " +
      soLuong +
      "\nTiền hàng: " +
      tienHang.toLocaleString("vi-VN") +
      "\nTiền ship: " +
      tienShip.toLocaleString("vi-VN")
    );


  if (!ok) {

    return;

  }


  apiGet({

    action:"nhapHang",

    maQR:
      currentOrder.maDon,

    maNV:nv,

    soLuong:soLuong,

    phuongThuc:
      currentMethod,

    tienShip:tienShip

  })

  .then(function(r){

    if (!r.ok) {

      throw new Error(
        r.msg ||
        "Nhập hàng thất bại"
      );

    }


    alert(
      "Nhập hàng thành công."
    );


    taiBaoCao();

    tiepTucQuet();

  })

  .catch(function(e){

    alert(
      e.message
    );

  });

}


/* ==========================================================
   GIAO HÀNG
   ========================================================== */

function xuLyGiaoHang() {

  if (!currentOrder) {

    return;

  }


  const ton =
    Number(
      currentOrder.tonKho || 0
    );


  if (ton <= 0) {

    alert(
      "Đơn hàng hiện không có tồn kho để giao."
    );

    return;

  }


  const ok =
    confirm(
      "Xác nhận GIAO HÀNG?\n\n" +
      "Số lượng giao toàn bộ: " +
      ton
    );


  if (!ok) {

    return;

  }


  apiGet({

    action:"giaoHang",

    maQR:
      currentOrder.maDon,

    maNV:nv,

    soLuongGiao:ton,

    phuongThuc:
      currentMethod

  })

  .then(function(r){

    if (!r.ok) {

      throw new Error(
        r.msg ||
        "Giao hàng thất bại"
      );

    }


    alert(
      "Giao hàng thành công."
    );


    taiBaoCao();

    tiepTucQuet();

  })

  .catch(function(e){

    alert(
      e.message
    );

  });

}


/* ==========================================================
   HOÀN HÀNG
   ========================================================== */

function xuLyHoanHang() {

  if (!currentOrder) {

    return;

  }


  const ok =
    confirm(
      "Xác nhận HOÀN HÀNG?\n\n" +
      "Số lượng hoàn: 1"
    );


  if (!ok) {

    return;

  }


  apiGet({

    action:"hoanHang",

    maQR:
      currentOrder.maDon,

    maNV:nv,

    soLuongHoan:1,

    phuongThuc:
      currentMethod

  })

  .then(function(r){

    if (!r.ok) {

      throw new Error(
        r.msg ||
        "Hoàn hàng thất bại"
      );

    }


    alert(
      "Hoàn hàng thành công."
    );


    taiBaoCao();

    tiepTucQuet();

  })

  .catch(function(e){

    alert(
      e.message
    );

  });

}


/* ==========================================================
   TIẾP TỤC QUÉT
   ========================================================== */

function tiepTucQuet() {

  currentOrder = null;

  currentMethod = "";

  document
    .getElementById("resultCard")
    .classList
    .add("hidden");


  lastCode = "";

  lastCodeTime = 0;


  if (stream) {

    running = true;

    qrFound = false;

    ocrRunning = false;

    noQrSince =
      performance.now();


    setStatus(
      "Đang tìm QR..."
    );


    requestAnimationFrame(
      vongQuet
    );

  } else {

    batDauQuet();

  }

}


/* ==========================================================
   BÁO CÁO
   ========================================================== */

function taiBaoCao() {

  apiGet({

    action:
      "baoCaoTrongNgay"

  })

  .then(function(r){

    if (!r.ok) {

      throw new Error(
        r.msg ||
        "Không lấy được báo cáo"
      );

    }


    const html =

      "<b>Ngày: " +
      (
        r.ngay || ""
      ) +
      "</b><br><br>" +

      "Số đơn nhập: " +
      (
        r.soDonNhap || 0
      ) +
      "<br>" +

      "Số đơn giao: " +
      (
        r.soDonGiao || 0
      ) +
      "<br>" +

      "Số đơn hoàn: " +
      (
        r.soDonHoan || 0
      ) +
      "<br>" +

      "Tổng tiền hàng: " +
      Number(
        r.tongTienHang || 0
      ).toLocaleString("vi-VN") +
      "<br>" +

      "Tổng tiền ship: " +
      Number(
        r.tongTienShip || 0
      ).toLocaleString("vi-VN");


    document
      .getElementById("baoCao")
      .innerHTML =
        html;

  })

  .catch(function(e){

    document
      .getElementById("baoCao")
      .textContent =
        e.message;

  });

}


/* ==========================================================
   KHI ĐÓNG TRANG
   ========================================================== */

window.addEventListener(
  "beforeunload",
  dungCamera
);

</script>
