<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quét đơn hàng</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#222}
.wrap{max-width:520px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0001;margin-bottom:12px}
h2{margin:0 0 14px;text-align:center}
input,button{width:100%;height:48px;border-radius:10px;border:1px solid #ccc;font-size:17px;padding:0 12px}
button{border:0;background:#1976d2;color:#fff;font-weight:bold;margin-top:10px}
button.secondary{background:#555}
button.success{background:#188038}
button.warn{background:#e37400}
.hidden{display:none}
#cameraBox{position:relative;background:#111;border-radius:14px;overflow:hidden}
#video{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
#scanLine{position:absolute;left:8%;right:8%;top:48%;height:2px;background:#00e676;box-shadow:0 0 8px #00e676}
.status{text-align:center;padding:10px;font-weight:bold}
.result{line-height:1.6}
.label{font-size:13px;color:#777}
.value{font-size:18px;font-weight:bold;word-break:break-word}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f0fe;color:#174ea6;font-size:13px}
.ok{color:#188038}.err{color:#c5221f}
.small{font-size:13px;color:#666;text-align:center}
#ocrCanvas{display:none}
</style>
</head>
<body>
<div class="wrap">

<div id="loginCard" class="card">
  <h2>ĐĂNG NHẬP</h2>
  <input id="maNV" placeholder="Mã nhân viên" autocomplete="username">
  <input id="matKhau" type="password" placeholder="Mật khẩu" autocomplete="current-password" style="margin-top:10px">
  <button onclick="dangNhap()">ĐĂNG NHẬP</button>
  <div id="loginMsg" class="status"></div>
</div>

<div id="appCard" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>NHÂN VIÊN: <span id="nvHienTai"></span></b>
      <button class="secondary" style="width:auto;height:38px;margin:0" onclick="dangXuat()">Thoát</button>
    </div>
  </div>

  <div class="card">
    <h2>QUÉT ĐƠN HÀNG</h2>
    <div id="cameraBox">
      <video id="video" autoplay playsinline muted></video>
      <div id="scanLine"></div>
    </div>
    <canvas id="ocrCanvas"></canvas>
    <div id="scanStatus" class="status">Đang chuẩn bị camera...</div>
    <div class="small">Ưu tiên QR. Nếu không có QR, máy tự chuyển sang nhận diện ID đơn hàng.</div>
    <button class="secondary" onclick="batDauQuet()">QUÉT LẠI</button>
  </div>

  <div id="resultCard" class="card hidden">
    <div style="text-align:center;margin-bottom:8px"><span id="methodBadge" class="badge"></span></div>
    <div class="result">
      <div class="label">Mã nhận dạng</div>
      <div id="maNhanDang" class="value"></div>

      <div class="label" style="margin-top:8px">ID đơn hàng</div>
      <div id="maDon" class="value"></div>

      <div class="label" style="margin-top:8px">Tên hàng</div>
      <div id="tenHang" class="value"></div>

      <div class="label" style="margin-top:8px">Số lượng</div>
      <div id="soLuong" class="value"></div>

      <div class="label" style="margin-top:8px">Tồn kho</div>
      <div id="tonKho" class="value"></div>

      <div class="label" style="margin-top:8px">Trạng thái</div>
      <div id="trangThai" class="value"></div>
    </div>
    <button class="success" onclick="batDauQuet()">QUÉT ĐƠN TIẾP</button>
  </div>
</div>
</div>

<script>
// ============================================================
// CHỈ CẦN SỬA DÒNG NÀY THÀNH URL WEB APP CỦA CODE.GS
// Ví dụ: https://script.google.com/macros/s/xxxxxxxx/exec
// ============================================================
const API_URL = "DAN_URL_WEB_APP_CODE_GS_VAO_DAY";

let nv = "";
let stream = null;
let running = false;
let qrFound = false;
let ocrRunning = false;
let noQrSince = 0;
let lastCode = "";
let lastCodeTime = 0;

const video = document.getElementById("video");
const scanStatus = document.getElementById("scanStatus");
const canvas = document.getElementById("ocrCanvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});

function setStatus(msg, cls="") {
  scanStatus.textContent = msg;
  scanStatus.className = "status " + cls;
}

function dangNhap() {
  const maNV = document.getElementById("maNV").value.trim();
  const matKhau = document.getElementById("matKhau").value;
  const box = document.getElementById("loginMsg");

  if (!maNV || !matKhau) {
    box.textContent = "Vui lòng nhập mã nhân viên và mật khẩu";
    box.className = "status err";
    return;
  }

  box.textContent = "Đang kiểm tra...";
  box.className = "status";

  apiGet({action:"dangNhap", maNV, matKhau})
    .then(r => {
      if (!r.ok) throw new Error(r.msg || "Đăng nhập thất bại");
      nv = r.maNV;
      document.getElementById("nvHienTai").textContent = nv;
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("appCard").classList.remove("hidden");
      batDauQuet();
    })
    .catch(e => {
      box.textContent = e.message;
      box.className = "status err";
    });
}

function dangXuat() {
  dungCamera();
  nv = "";
  document.getElementById("appCard").classList.add("hidden");
  document.getElementById("loginCard").classList.remove("hidden");
}

function apiGet(params) {
  if (!API_URL || API_URL.includes("DAN_URL")) {
    return Promise.reject(new Error("Chưa nhập API_URL của Web App Code.gs"));
  }
  const qs = new URLSearchParams(params).toString();
  return fetch(API_URL + "?" + qs, {method:"GET", redirect:"follow"})
    .then(r => {
      if (!r.ok) throw new Error("API HTTP " + r.status);
      return r.text();
    })
    .then(t => {
      try { return JSON.parse(t); }
      catch(e) { throw new Error("API không trả JSON: " + t.slice(0,200)); }
    });
}

async function batDauQuet() {
  document.getElementById("resultCard").classList.add("hidden");
  qrFound = false;
  ocrRunning = false;
  lastCode = "";
  noQrSince = performance.now();

  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
        audio:false
      });
      video.srcObject = stream;
      await video.play();
    } catch(e) {
      setStatus("Không mở được camera: " + e.message, "err");
      return;
    }
  }

  running = true;
  setStatus("Đang tìm QR...", "");
  requestAnimationFrame(vongQuet);
}

function dungCamera() {
  running = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

function vongQuet() {
  if (!running) return;

  // ---------- ƯU TIÊN 1: QR ----------
  if (video.readyState >= 2 && video.videoWidth > 0) {
    const w = video.videoWidth;
    const h = video.videoHeight;

    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(video,0,0,w,h);

    const image = ctx.getImageData(0,0,w,h);
    const code = jsQR(image.data,w,h,{inversionAttempts:"attemptBoth"});

    if (code && code.data) {
      const value = String(code.data).trim();
      if (value) {
        qrFound = true;
        noQrSince = performance.now();
        xuLyMa(value, "QR");
        return;
      }
    }
  }

  // ---------- ƯU TIÊN 2: OCR ID ----------
  if (!qrFound && !ocrRunning && performance.now() - noQrSince > 1600) {
    nhanDangID();
  }

  requestAnimationFrame(vongQuet);
}

async function nhanDangID() {
  if (ocrRunning || !running || qrFound) return;
  ocrRunning = true;
  setStatus("Không thấy QR → đang nhận diện ID đơn hàng...", "");

  try {
    // Cắt phần trên của phiếu vì ID đơn hàng thường nằm ở khu vực này.
    const w = video.videoWidth;
    const h = video.videoHeight;
    const cropW = w;
    const cropH = Math.floor(h * 0.62);

    canvas.width = cropW;
    canvas.height = cropH;
    ctx.drawImage(video,0,0,w,cropH,0,0,cropW,cropH);

    const worker = await Tesseract.createWorker("vie");
    const ret = await worker.recognize(canvas);
    await worker.terminate();

    // Không lấy chữ tự do: chỉ tìm cụm ID + chuỗi số.
    const text = ret.data.text || "";
    const id = timIDTrongOCR(text);

    if (id) {
      if (performance.now() - noQrSince > 0) {
        xuLyMa(id, "OCR_ID");
        return;
      }
    }

    setStatus("Chưa đọc được ID → đưa phiếu gần và rõ hơn...", "");
  } catch(e) {
    setStatus("OCR lỗi: " + e.message, "err");
  } finally {
    ocrRunning = false;
    if (running && !qrFound) {
      noQrSince = performance.now() + 900;
    }
  }
}

function timIDTrongOCR(text) {
  const s = String(text || "")
    .replace(/[|]/g,"1")
    .replace(/[Oo]/g,"0")
    .replace(/[IiLl]/g,"1");

  // Ưu tiên dòng có ID/đơn hàng.
  const lines = s.split(/\r?\n/);

  for (const line of lines) {
    if (/id\s*don\s*hang|id\s*đơn\s*hàng|don\s*hang|đơn\s*hàng/i.test(line)) {
      const m = line.match(/\b\d{8,14}\b/);
      if (m) return m[0];
    }
  }

  // Dự phòng: tìm chuỗi 10 số trong toàn bộ OCR.
  const all = s.match(/\b\d{10}\b/g);
  return all && all.length ? all[0] : "";
}

function xuLyMa(ma, phuongThuc) {
  ma = String(ma || "").trim();
  if (!ma) return;

  // Chống quét lặp cùng một mã.
  if (ma === lastCode && performance.now() - lastCodeTime < 5000) return;
  lastCode = ma;
  lastCodeTime = performance.now();

  running = false;
  setStatus("Đã nhận " + (phuongThuc === "QR" ? "QR" : "ID") + ": " + ma, "");

  // QR có thể chứa chuỗi khác mã đơn. Code.gs timDon hiện tìm theo MA_QR.
  apiGet({action:"timDon", maQR:ma})
    .then(r => {
      if (!r.ok) throw new Error(r.msg || "Không tìm thấy đơn hàng");
      hienThiDon(r, phuongThuc, ma);
    })
    .catch(e => {
      setStatus(e.message, "err");
      document.getElementById("resultCard").classList.add("hidden");
      setTimeout(() => {
        if (stream) {
          running = true;
          noQrSince = performance.now();
          requestAnimationFrame(vongQuet);
        }
      }, 1200);
    });
}

function hienThiDon(r, method, ma) {
  document.getElementById("methodBadge").textContent =
    method === "QR" ? "NHẬN DẠNG BẰNG QR" : "NHẬN DẠNG BẰNG ID";

  document.getElementById("maNhanDang").textContent = ma;
  document.getElementById("maDon").textContent = r.maDon || "";
  document.getElementById("tenHang").textContent = r.tenHang || "";
  document.getElementById("soLuong").textContent = r.soLuong ?? 0;
  document.getElementById("tonKho").textContent = r.tonKho ?? 0;
  document.getElementById("trangThai").textContent = r.trangThai || "";

  document.getElementById("resultCard").classList.remove("hidden");
  setStatus("Đã nhận dạng thành công", "ok");
}

window.addEventListener("beforeunload", dungCamera);
</script>
</body>
</html>
